name: Veille consultations 360

on:
  schedule:
    - cron: "0 5 * * 1-5"   # du lundi au vendredi, vers 6h-7h heure de Paris
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

concurrency:
  group: veille
  cancel-in-progress: false  # ne jamais interrompre une publication en cours

jobs:
  # ------------------------------------------------------------------
  # 1. Préparer : lance la veille, sauvegarde l'historique, prépare la page
  # ------------------------------------------------------------------
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # pour sauvegarder l'historique dans le dépôt
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests feedparser

      - name: Lancer la veille
        run: python veille_ao_com360.py --jours 30

      - name: Préparer la page
        run: |
          mkdir site
          cp veille_com360.html site/index.html
          cp veille_com360.csv site/veille_com360.csv

      - name: Sauvegarder l'historique (pour repérer les nouveautés)
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille_com360.sqlite
          git commit -m "maj historique" || { echo "rien à commiter"; exit 0; }
          # si le dépôt a changé entre-temps (relance d'un ancien passage), on se remet à jour d'abord
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; echo "mise à jour impossible, historique non sauvegardé"; exit 0; }
          git push || echo "push ignoré"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # ------------------------------------------------------------------
  # 2. Publier : met la page en ligne, avec une seconde tentative si GitHub Pages a un raté.
  #    En cas d'échec, "Re-run failed jobs" ne relance QUE cette étape : pas de doublon.
  # ------------------------------------------------------------------
  publier:
    needs: preparer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Publier la page
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Patienter avant la seconde tentative
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Seconde tentative de publication
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
